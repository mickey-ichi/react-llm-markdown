<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>react-llm-markdown — safe Markdown for React and React Native</title>
    <meta name="description" content="Paste or stream Markdown and see it rendered safely on the web and in React Native: GFM, code, math, Mermaid and ECharts, hardened against prompt-injected HTML and links." />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:image" content="https://mickey-ichi.github.io/react-llm-markdown/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site.css" />
    <script>
      try {
        var t = localStorage.getItem('rlm-site-theme');
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
