name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm. npm auth is Trusted Publishing
# (OIDC): no token secret; npmjs.com → react-llm-markdown → Settings → Trusted Publisher must name this
# repository and `release.yml`. Provenance is attached automatically.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing + provenance
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, which Trusted Publishing needs.
          node-version: 24
          # No dependency cache in a job that can publish (id-token: write).
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm run build
      - run: npm run typecheck # after build: the tests type-check against dist/
      - run: npm test
      - name: Publish to npm
        env:
          # A GitHub pre-release goes to the `next` dist-tag.
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "react-llm-markdown@$version" version >/dev/null 2>&1; then
            echo "react-llm-markdown@$version is already on npm - skipping"
          else
            npm publish --tag "$DIST_TAG"
          fi
