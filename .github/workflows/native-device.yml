name: Native E2E

# The React Native renderer on a real iOS simulator and Android emulator: the Expo test app (e2e-app/) is built as a
# release app with this commit's package, then driven by the Maestro flows in e2e-app/maestro/.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/native/**
      - src/core/**
      - e2e-app/**
      - scripts/build-example.mjs
      - package.json
      - .github/workflows/native-device.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Install the packed package into the test app
        run: node scripts/build-example.mjs --no-web
      - name: Build the release APK
        working-directory: e2e-app
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global anr_show_background 0
            adb install e2e-app/android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e-app/maestro --format junit --output maestro-android.xml --test-output-dir maestro-android
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: |
            maestro-android/
            maestro-android.xml
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Install the packed package into the test app
        run: node scripts/build-example.mjs --no-web
      - name: Build the release app for the simulator
        working-directory: e2e-app
        run: |
          set -o pipefail
          npx expo prebuild --platform ios
          xcodebuild -version
          xcodebuild -workspace ios/RlmE2E.xcworkspace -scheme RlmE2E -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || { grep -E 'error:|Error:|\*\* BUILD FAILED' -A3 xcodebuild.log | head -80; exit 1; }
          tail -5 xcodebuild.log
      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" e2e-app/ios/build/Build/Products/Release-iphonesimulator/RlmE2E.app
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows on the iOS simulator
        env:
          # Maestro's XCTest driver takes longer than the default to start on a fresh CI simulator.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
        run: maestro --device "$SIMULATOR_UDID" test e2e-app/maestro --format junit --output maestro-ios.xml --test-output-dir maestro-ios
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios
          path: |
            maestro-ios/
            maestro-ios.xml
          if-no-files-found: ignore
